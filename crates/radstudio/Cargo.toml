[package]
name = "radstudio"
version = "1.0.0"
edition.workspace = true
description = "A utility library for the Embarcadero RAD Studio IDE"
repository = "https://github.com/Delphier/radstudio"
homepage = "https://github.com/Delphier/radstudio"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
radstudio-macros = { path = "../radstudio-macros", version = "0.2.0" }
strum = { version = "0.28.0", features = ["derive"] }
unicase = "2.9.0"
tempfile = "3.27.0"
xmltree = "0.12.0"
thiserror = "2.0.20"
indoc = "2.0.7"
uuid = { version = "1.26.0", features = ["v4"] }
inquire = "0.9.4"
indexmap = { version = "2.14.2", features = ["serde"] }
clap.workspace = true
envz.workspace = true
serde.workspace = true
serde_json.workspace = true
