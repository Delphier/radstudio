[workspace]
members = ["crates/radstudio", "crates/radstudio-cli", "crates/radstudio-macros"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
envz = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
